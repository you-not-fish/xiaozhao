version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xiaozhao-postgres
    environment:
      POSTGRES_USER: xiaozhao
      POSTGRES_PASSWORD: xiaozhao
      POSTGRES_DB: xiaozhao
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - xiaozhao-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaozhao -d xiaozhao"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xiaozhao-redis
    ports:
      - "6379:6379"
    volumes:
      - xiaozhao-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: xiaozhao-minio
    environment:
      MINIO_ROOT_USER: xiaozhao
      MINIO_ROOT_PASSWORD: xiaozhao123
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - xiaozhao-minio-data:/data

volumes:
  xiaozhao-pg-data:
  xiaozhao-redis-data:
  xiaozhao-minio-data:
