server:
  host: "0.0.0.0"
  port: 8080
  read_timeout_seconds: 30
  write_timeout_seconds: 60
  shutdown_timeout_seconds: 15

log:
  level: "info"          # debug / info / warn / error
  encoding: "console"    # console / json
  caller: true

postgres:
  dsn: "host=127.0.0.1 port=5432 user=xiaozhao password=xiaozhao dbname=xiaozhao sslmode=disable TimeZone=Asia/Shanghai"
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime_seconds: 1800
  auto_migrate: true

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 20

auth:
  jwt_secret: "change-me-in-production-32-bytes-min"
  jwt_issuer: "xiaozhao"
  access_token_ttl_seconds: 86400    # 24h
  refresh_token_ttl_seconds: 2592000 # 30d
  password_min_length: 8

ratelimit:
  enabled: true
  per_user_per_minute: 120
  per_ip_per_minute: 300

# 模型网关：P0 演示默认使用 mock Provider，保证无外部依赖即可跑通 Agent 链路。
# 接入真实 OpenAI / 国内 OpenAI-compatible 供应商时，把 provider 切到 "openai"
# 并在 openai.* 填入 base_url 与 api_key（推荐通过环境变量注入）。
model:
  provider: "mock"                 # mock | openai
  default_model: "mock-default"    # provider=openai 时改成具体模型名，例如 gpt-4o-mini
  openai:
    name: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: ""                    # 推荐通过 XIAOZHAO_MODEL_OPENAI_API_KEY 环境变量注入
    timeout_seconds: 60

# Embedding 网关：本地默认 mock，真实知识库检索可切到 OpenAI-compatible。
embedding:
  provider: "mock"                 # mock | openai
  model: "text-embedding-3-small"
  dim: 1536
  openai:
    name: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: ""                    # 推荐通过 XIAOZHAO_EMBEDDING_OPENAI_API_KEY 环境变量注入
    model: "text-embedding-3-small"
    timeout_seconds: 60

# Agent 运行参数。
agent:
  max_tool_iterations: 5           # 单次 response 内的工具循环最大轮数
  model_timeout_seconds: 60
  tool_timeout_seconds: 15
  max_tool_result_kb: 64           # 工具结果截断阈值

# 文件上传对象存储。MVP 使用后端鉴权直传到 S3-compatible/MinIO。
storage:
  provider: "minio"
  endpoint: "127.0.0.1:9000"
  access_key: "xiaozhao"
  secret_key: "xiaozhao123"
  bucket: "xiaozhao-files"
  region: "us-east-1"
  use_ssl: false
  auto_create_bucket: true
  max_upload_mb: 50

# 联网搜索工具。默认 mock，真实中文搜索可切到 bocha，并通过环境变量注入 API Key。
web_search:
  provider: "mock"                 # mock | bocha
  max_results: 5
  default_freshness: "noLimit"     # noLimit | oneDay | oneWeek | oneMonth | oneYear
  timeout_seconds: 15              # 工具调用整体超时
  bocha:
    base_url: "https://api.bochaai.com/v1/web-search"
    api_key: ""                    # 推荐通过 XIAOZHAO_WEB_SEARCH_BOCHA_API_KEY 注入
    timeout_seconds: 15

# 网页抓取工具。独立于搜索 provider，用于 web_fetch 工具打开任意 URL。
web_fetch:
  timeout_seconds: 15
  max_body_kb: 1024
  max_redirects: 3
